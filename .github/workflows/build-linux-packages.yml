name: Build Linux Packages

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ xutils-dev libx11-dev libxext-dev

      - name: Configure
        run: ./Configure

      - name: Run imake
        run: imake -I./config -DInstallInTopDir

      - name: Build
        run: make World

      - name: Install
        run: make install

      - name: Test binary execution
        run: |
          echo "Testing binary execution to ensure they work correctly..."
          
          # Get the platform-specific directory name
          PLATFORM_DIR=$(ls -1 bin | head -1)
          echo "Platform directory: $PLATFORM_DIR"
          
          # Test a few key binaries
          BINARIES="dciodvfy dcdump dcfile dcentvfy"
          
          for binary in $BINARIES; do
              BINARY_PATH="bin/$PLATFORM_DIR/$binary"
              if [ -f "$BINARY_PATH" ]; then
                  echo "Testing $binary..."
                  # Test that the binary can at least show usage without crashing
                  if $BINARY_PATH 2>&1 | head -5; then
                      echo "✓ $binary executed successfully"
                  else
                      echo "✗ $binary failed to execute"
                      exit 1
                  fi
              else
                  echo "⚠ $binary not found at $BINARY_PATH"
              fi
          done
          
          echo "All binary execution tests passed!"

      - name: Check binary dependencies
        run: |
          echo "Checking binary dependencies..."
          
          # Get the platform-specific directory name
          PLATFORM_DIR=$(ls -1 bin | head -1)
          
          # Check dependencies for a key binary
          echo "Dependencies for dciodvfy:"
          ldd bin/$PLATFORM_DIR/dciodvfy
          
          # Check GLIBC and GLIBCXX versions required
          echo ""
          echo "Required GLIBC versions:"
          objdump -T bin/$PLATFORM_DIR/dciodvfy | grep GLIBC | awk '{print $5}' | grep GLIBC | sort -u
          
          echo ""
          echo "Required GLIBCXX versions:"
          objdump -T bin/$PLATFORM_DIR/dciodvfy | grep GLIBCXX | awk '{print $5}' | grep GLIBCXX | sort -u

      - name: Package binaries
        run: |
          # Get the platform-specific directory name
          PLATFORM_DIR=$(ls -1 bin | head -1)
          echo "Platform directory: $PLATFORM_DIR"
          
          # Create a tar.gz archive of the binaries
          cd bin/$PLATFORM_DIR
          tar -czf ../../dicom3tools-linux-x86_64.tar.gz .
          cd ../..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dicom3tools-linux-x86_64
          path: dicom3tools-linux-x86_64.tar.gz
          retention-days: 90

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: dicom3tools-linux-x86_64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
