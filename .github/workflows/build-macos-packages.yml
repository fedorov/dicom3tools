name: Build macOS Packages

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-macos:
    # Apple Silicon runner; the binaries produced are universal (x86_64 + arm64),
    # since Configure builds Darwin for both architectures by default
    runs-on: macos-15
    permissions:
      contents: write

    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          # imake and makedepend drive the build; gawk is required because the
          # BSD awk shipped with macOS cannot process the header generation
          # scripts in libsrc/support (see INSTALL)
          brew install imake makedepend gawk

      - name: Install XQuartz
        run: |
          # dcdisp is the one program that links X11. XQuartz is used rather than
          # the Homebrew X11 formulae for two reasons: its libraries are universal
          # (x86_64 i386 arm64), so they can be linked into a universal binary, and
          # /opt/X11 is where an end user's X11 lives, so the dcdisp we ship
          # resolves against their XQuartz rather than a Homebrew prefix they may
          # not have. Configure picks /opt/X11 up on its own.
          brew install --cask xquartz
          lipo -info /opt/X11/lib/libX11.6.dylib

      - name: Configure
        run: ./Configure

      - name: Run imake
        run: imake -I./config -DInstallInTopDir

      - name: Build
        # The awk scripts that generate the dconvert headers write their
        # diagnostics to /dev/tty, which is fatal to gawk when there is no
        # controlling terminal. script(1) supplies a pseudo terminal; -e passes
        # the exit status of the command through.
        run: script -q /dev/null make World

      - name: Install
        run: script -q /dev/null make install

      - name: Check build completeness
        # `make World` returns 0 even when a subdirectory fails - a broken
        # dconvert build reports "Error 2" and the top level make still exits 0
        # - so neither build step above can be trusted to have built
        # everything. himrtodc, himrdump, ge9800todc and ge9800dump are the
        # canaries for the /dev/tty problem described on the Build step: they
        # are exactly what goes missing when the awk header generation runs
        # without a controlling terminal, and without this check a package
        # short of them would ship silently.
        run: |
          PLATFORM_DIR=$(ls -1 bin | head -1)
          echo "Platform directory: $PLATFORM_DIR"
          echo "Programs built: $(ls -1 "bin/$PLATFORM_DIR" | wc -l)"

          MISSING=""
          for program in dciodvfy dcdump dcfile dcentvfy dcdisp \
                         himrtodc himrdump ge9800todc ge9800dump; do
              [ -f "bin/$PLATFORM_DIR/$program" ] || MISSING="$MISSING $program"
          done
          if [ -n "$MISSING" ]; then
              echo "✗ incomplete build, missing:$MISSING"
              exit 1
          fi
          echo "✓ all required programs present"

      - name: Test binary execution
        run: |
          echo "Testing binary execution to ensure they work correctly..."

          # Get the platform-specific directory name
          PLATFORM_DIR=$(ls -1 bin | head -1)
          echo "Platform directory: $PLATFORM_DIR"

          # Test a few key binaries
          BINARIES="dciodvfy dcdump dcfile dcentvfy"

          for binary in $BINARIES; do
              BINARY_PATH="bin/$PLATFORM_DIR/$binary"
              if [ -f "$BINARY_PATH" ]; then
                  echo "Testing $binary..."
                  # Test that the binary can at least show usage without crashing
                  if $BINARY_PATH 2>&1 | head -5; then
                      echo "✓ $binary executed successfully"
                  else
                      echo "✗ $binary failed to execute"
                      exit 1
                  fi
              else
                  echo "✗ $binary not found at $BINARY_PATH"
                  exit 1
              fi
          done

          echo "All binary execution tests passed!"

      - name: Check binary architectures and dependencies
        run: |
          PLATFORM_DIR=$(ls -1 bin | head -1)

          echo "Architectures in dciodvfy:"
          lipo -info "bin/$PLATFORM_DIR/dciodvfy"

          echo ""
          echo "Dependencies for dciodvfy:"
          otool -L "bin/$PLATFORM_DIR/dciodvfy"

          echo ""
          echo "Minimum macOS version:"
          otool -l "bin/$PLATFORM_DIR/dciodvfy" | grep -A4 LC_BUILD_VERSION | head -12

          # dcdisp must resolve X11 out of /opt/X11, where the user's XQuartz is,
          # not out of a Homebrew prefix
          echo ""
          echo "Dependencies for dcdisp:"
          otool -L "bin/$PLATFORM_DIR/dcdisp"
          if otool -L "bin/$PLATFORM_DIR/dcdisp" | grep -qE '/(opt/homebrew|usr/local)/'; then
              echo "✗ dcdisp links a Homebrew library, which end users will not have"
              exit 1
          fi
          otool -L "bin/$PLATFORM_DIR/dcdisp" | grep -q '/opt/X11/lib/libX11' || {
              echo "✗ dcdisp does not link /opt/X11/lib/libX11"
              exit 1
          }
          echo "✓ dcdisp links X11 from /opt/X11"

          echo ""
          echo "Checking that every binary carries both architectures..."
          for binary in "bin/$PLATFORM_DIR"/*; do
              [ -f "$binary" ] || continue
              # dccmp and dcdiff are shell scripts, not Mach-O
              case "$(file -b "$binary")" in
                  *Mach-O*) ;;
                  *) continue ;;
              esac
              ARCHS=$(lipo -archs "$binary")
              case "$ARCHS" in
                  *x86_64*arm64*|*arm64*x86_64*)
                      echo "✓ $(basename "$binary"): $ARCHS" ;;
                  *)
                      echo "✗ $(basename "$binary") is not universal: $ARCHS"
                      exit 1 ;;
              esac
          done

      - name: Package binaries
        run: |
          # Get the platform-specific directory name
          PLATFORM_DIR=$(ls -1 bin | head -1)
          echo "Platform directory: $PLATFORM_DIR"
          SRC="bin/$PLATFORM_DIR"

          # Three packages out of the one build: the universal binaries as built,
          # plus single architecture packages of half the size, split out with
          # lipo (which preserves each slice's ad-hoc code signature)
          mkdir -p pkg/universal pkg/arm64 pkg/x86_64
          for f in "$SRC"/*; do
              b=$(basename "$f")
              cp -p "$f" "pkg/universal/$b"
              if file -b "$f" | grep -q Mach-O; then
                  lipo -thin arm64  "$f" -output "pkg/arm64/$b"
                  lipo -thin x86_64 "$f" -output "pkg/x86_64/$b"
              else
                  cp -p "$f" "pkg/arm64/$b"
                  cp -p "$f" "pkg/x86_64/$b"
              fi
          done

          # The license has to travel with the binaries it covers, and
          # VERSION.txt records which upstream snapshot they were built from,
          # which the archive otherwise has no way of saying. Copied into the
          # staging directories rather than into $SRC so the lipo loop above
          # never sees them.
          for a in universal arm64 x86_64; do
              cp COPYRIGHT VERSION.txt "pkg/$a/"
              (cd "pkg/$a" && COPYFILE_DISABLE=1 tar -czf "../../dicom3tools-macos-$a.tar.gz" .)
          done
          ls -lh dicom3tools-macos-*.tar.gz

      - name: Upload universal artifact
        uses: actions/upload-artifact@v7
        with:
          name: dicom3tools-macos-universal
          path: dicom3tools-macos-universal.tar.gz
          retention-days: 90

      - name: Upload arm64 artifact
        uses: actions/upload-artifact@v7
        with:
          name: dicom3tools-macos-arm64
          path: dicom3tools-macos-arm64.tar.gz
          retention-days: 90

      - name: Upload x86_64 artifact
        uses: actions/upload-artifact@v7
        with:
          name: dicom3tools-macos-x86_64
          path: dicom3tools-macos-x86_64.tar.gz
          retention-days: 90

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dicom3tools-macos-universal.tar.gz
            dicom3tools-macos-arm64.tar.gz
            dicom3tools-macos-x86_64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
